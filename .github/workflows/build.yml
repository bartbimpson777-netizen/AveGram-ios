name: Build AveGram (unsigned IPA)

on:
  workflow_dispatch:
  # GitHub's macOS runners are often out of capacity and cancel a job after ~15 minutes in the queue.
  # This retries on its own until one build of the current commit succeeds (the gate job is free).
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: avegram-build
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=20" --jq "[.workflow_runs[] | select(.head_sha == \"${{ github.sha }}\")] | length")
          if [ "$ok" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Check secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Add API_ID and API_HASH to Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Select newest installed Xcode
        run: |
          df -h / | tail -1
          sysctl -n hw.memsize
          XCODE=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode_26*.app 2>/dev/null | grep -v "\.0\.app" | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode found on this runner"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Write build configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'EOF'
          import json, os
          config = {
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": "C67CF9S4VU",
              "is_internal_build": "false",
              "is_appstore_build": "true",
              "appstore_id": "686449807",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "org.telegram.telegramPremium.monthly",
              "enable_siri": True,
              "enable_icloud": True,
          }
          with open("build-system/avegram-configuration.json", "w") as f:
              json.dump(config, f, indent=4)
          EOF

      - name: Build the app
        run: |
          set -x
          BUILD_NUMBER=$(( $(cat build_number_offset) + ${{ github.run_number }} ))
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/avegram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect IPA
        run: |
          mkdir -p build/artifacts
          IPA=$(ls bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa 2>/dev/null | head -n1)
          if [ -z "$IPA" ]; then
            IPA=$(find -L bazel-bin -name Telegram.ipa 2>/dev/null | head -n1)
          fi
          if [ -z "$IPA" ]; then
            echo "::error::Telegram.ipa was not produced"
            exit 1
          fi
          cp "$IPA" build/artifacts/AveGram-unsigned.ipa
          ls -la build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: AveGram-unsigned
          path: build/artifacts/AveGram-unsigned.ipa
          retention-days: 14
